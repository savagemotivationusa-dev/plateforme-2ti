  <script>
    /* Thème appliqué avant l'affichage (partagé avec la matière Informatique). */
    (function () {
      var t = null;
      try { t = localStorage.getItem("plateforme2ti:theme") || (JSON.parse(localStorage.getItem("plateforme2ti:maths:v1")) || {}).theme; } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
    /* Configuration de la coque (voir js/app.js). */
    window.STORE_KEY = "plateforme2ti:maths:v1";
    window.APP_SUBJECTS = [
      { label: "Informatique", href: "../index.html" },
      { label: "Mathématiques", href: "index.html", current: true }
    ];
    window.APP_NAV = [
      ["", "Apprendre"],
      ["accueil", "Accueil", "home"], ["cours", "Cours", "book"], ["fiches", "Fiches de révision", "list"],

      ["", "Suivi"],
      ["progression", "Progression", "chart"], ["correction", "Dernière correction", "check"],
      ["notes", "Notes de contenu", "info"]
    ];
    window.APP_ALIAS = { "": "accueil", lecon: "cours", devoir: "devoirs", recherche: "" };
